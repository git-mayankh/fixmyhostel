global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'fixmyhostel-api'
    metrics_path: '/api/ops/metrics'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
