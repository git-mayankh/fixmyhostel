###############################################################################
# FixMyHostel Nagios Monitoring Configuration
###############################################################################

define contact {
    contact_name                    devops-admin
    alias                           FixMyHostel DevOps Lead
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r
    host_notification_options       d,u,r
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
    email                           mayank@fixmyhostel.com
}

define contactgroup {
    contactgroup_name               fmh-admins
    alias                           FixMyHostel Administrators
    members                         devops-admin
}

###############################################################################
# HOST DEFINITIONS
###############################################################################

define host {
    use                             generic-host
    host_name                       fmh-frontend
    alias                           FixMyHostel React Frontend
    address                         frontend
    max_check_attempts              3
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    contact_groups                  fmh-admins
    notification_interval           60
    notification_period             24x7
}

define host {
    use                             generic-host
    host_name                       fmh-api
    alias                           FixMyHostel Node Express API
    address                         api
    max_check_attempts              3
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    contact_groups                  fmh-admins
    notification_interval           60
    notification_period             24x7
}

