###############################################################################
# SERVICE DEFINITIONS
###############################################################################

# 1. Frontend HTTP check (Port 80)
define service {
    use                             generic-service
    host_name                       fmh-frontend
    service_description             HTTP Frontend Web Server
    check_command                   check_http!-p 80
    contact_groups                  fmh-admins
}

# 2. API Health Check Endpoint (Port 5000, /api/ops/health)
define service {
    use                             generic-service
    host_name                       fmh-api
    service_description             HTTP API Health Check
    check_command                   check_http!-p 5000 -u /api/ops/health -e 200
    contact_groups                  fmh-admins
}

# 3. API Metrics Endpoint (Port 5000, /api/ops/metrics)
define service {
    use                             generic-service
    host_name                       fmh-api
    service_description             HTTP API Prometheus Metrics
    check_command                   check_http!-p 5000 -u /api/ops/metrics -e 200
    contact_groups                  fmh-admins
}

# 4. MySQL Connectivity (Port 3306)
define service {
    use                             generic-service
    host_name                       fmh-mysql
    service_description             TCP MySQL 3306 Port Check
    check_command                   check_tcp!3306
    contact_groups                  fmh-admins
}

# 5. Redis Connectivity (Port 6379)
define service {
    use                             generic-service
    host_name                       fmh-redis
    service_description             TCP Redis 6379 Port Check
    check_command                   check_tcp!6379
    contact_groups                  fmh-admins
}

# 6. Prometheus Service Check (Port 9090)
define service {
    use                             generic-service
    host_name                       fmh-prometheus
    service_description             HTTP Prometheus Dashboard
    check_command                   check_http!-p 9090 -u /-/healthy
    contact_groups                  fmh-admins
}

# 7. Grafana Service Check (Port 3000)
define service {
    use                             generic-service
    host_name                       fmh-grafana
    service_description             HTTP Grafana Health Check
    check_command                   check_http!-p 3000 -u /api/health
    contact_groups                  fmh-admins
}
